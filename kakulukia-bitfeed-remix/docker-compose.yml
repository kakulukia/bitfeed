# Published multiarch image indexes from the reviewed source commit.
services:
  app_proxy:
    environment:
      APP_HOST: kakulukia-bitfeed-remix_web_1
      APP_PORT: 80

  web:
    image: ghcr.io/kakulukia/bitfeed-remix-client:sha-2dc9af02aeeb4d71b4e114f5d531c5734042d991@sha256:f5329b1b10717c1bf3fddfb5c38323cf15e89095e543374c5003fdff14b0bf83
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - api
    environment:
      TARGET: umbrel
      BACKEND_HOST: kakulukia-bitfeed-remix_api_1
      BACKEND_PORT: 8315

  api:
    image: ghcr.io/kakulukia/bitfeed-remix-server:sha-2dc9af02aeeb4d71b4e114f5d531c5734042d991@sha256:94c3d4f5d9c098ac96e0b756f51da3382a67bf53a4654936901a6793a5b62bf8
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 8315
      BITCOIN_HOST: "$APP_BITCOIN_NODE_IP"
      BITCOIN_ZMQ_RAWTX_PORT: "$APP_BITCOIN_ZMQ_RAWTX_PORT"
      BITCOIN_ZMQ_RAWBLOCK_PORT: "$APP_BITCOIN_ZMQ_RAWBLOCK_PORT"
      BITCOIN_ZMQ_SEQUENCE_PORT: "$APP_BITCOIN_ZMQ_SEQUENCE_PORT"
      BITCOIN_RPC_PORT: "$APP_BITCOIN_RPC_PORT"
      BITCOIN_RPC_USER: "$APP_BITCOIN_RPC_USER"
      BITCOIN_RPC_PASS: "$APP_BITCOIN_RPC_PASS"
      TARGET: umbrel
      RPC_POOLS: "1"
      RPC_POOL_SIZE: "16"
      LOG_LEVEL: info
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
