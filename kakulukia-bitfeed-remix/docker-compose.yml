# Release draft: replace both image references with the published tag and digest.
services:
  app_proxy:
    environment:
      APP_HOST: kakulukia-bitfeed-remix_web_1
      APP_PORT: 80

  web:
    image: ghcr.io/kakulukia/bitfeed-remix-client:UNPUBLISHED
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - api
    environment:
      TARGET: umbrel
      BACKEND_HOST: kakulukia-bitfeed-remix_api_1
      BACKEND_PORT: 8315

  api:
    image: ghcr.io/kakulukia/bitfeed-remix-server:UNPUBLISHED
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 8315
      BITCOIN_HOST: "$APP_BITCOIN_NODE_IP"
      BITCOIN_ZMQ_RAWTX_PORT: "$APP_BITCOIN_ZMQ_RAWTX_PORT"
      BITCOIN_ZMQ_RAWBLOCK_PORT: "$APP_BITCOIN_ZMQ_RAWBLOCK_PORT"
      BITCOIN_ZMQ_SEQUENCE_PORT: "$APP_BITCOIN_ZMQ_SEQUENCE_PORT"
      BITCOIN_RPC_PORT: "$APP_BITCOIN_RPC_PORT"
      BITCOIN_RPC_USER: "$APP_BITCOIN_RPC_USER"
      BITCOIN_RPC_PASS: "$APP_BITCOIN_RPC_PASS"
      TARGET: umbrel
      RPC_POOLS: "1"
      RPC_POOL_SIZE: "16"
      LOG_LEVEL: info
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
